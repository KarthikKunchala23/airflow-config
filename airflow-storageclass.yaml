apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: airflow-sc             #  your custom StorageClass name
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3                    # gp3 is newer and cheaper than gp2
  fsType: ext4
  encrypted: "true"
  kmsKeyId: ""                 # (optional) Add your CMK ARN if you use KMS
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
